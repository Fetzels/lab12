name: security
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read
  
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v4.0.1
        with: { fetch-depth: 0 }   # gitleaks needs history

      # GATE: secret scan — exit non-zero on a finding, so the build fails
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1

      # REPORT: SAST
      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto    # drop --error to make it a report

      # Gate: dependency scan
      - name: Dependency scan (Trivy)
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 1 /repo
